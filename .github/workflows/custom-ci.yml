name: custom-ci

# Build the deploy image (without pushing) for every PR into custom/main, so a
# broken upstream sync or Dockerfile change fails here instead of in production.
# Upstream's gradle.yml only covers master; this file is ours.

on:
  pull_request:
    branches: [ custom/main ]

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          cache-from: type=gha
